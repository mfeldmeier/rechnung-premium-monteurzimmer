name: Build & Deploy (tar über SSH)

# Vorher lief das über FTPS. Das hat bei vendor/ reproduzierbar abgebrochen:
# von 4.270 Dateien kamen 2.515 an, ohne dass der Lauf rot wurde - die Seite
# scheiterte dann an fehlendem vendor/autoload.php.
#
# rsync wäre die naheliegende Alternative, ist auf dem netcup-Webhosting aber
# nicht installiert. tar über eine SSH-Pipe kommt mit tar und gzip auf der
# Gegenseite aus, überträgt alles als einen Strom und zählt danach nach.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mbstring, json, gd, zip
          coverage: none

      - name: Composer-Abhängigkeiten installieren
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Vollständigkeit prüfen
        run: |
          test -f vendor/autoload.php || { echo "::error::vendor/autoload.php wurde nicht erzeugt"; exit 1; }
          echo "Dateien in vendor: $(find vendor -type f | wc -l)"

      # Die .env entsteht aus den Secrets und wird mit übertragen, damit der
      # Server ohne Handgriff läuft. Sie wird dabei bei jedem Deploy
      # überschrieben - Konfiguration gehört also in die Secrets, nicht auf
      # den Server. Der Wert kommt über die Umgebung statt als Argument, so
      # steht er nicht im Action-Log.
      - name: .env aus Secrets erzeugen
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PREFIX: ${{ secrets.DB_PREFIX }}
        run: |
          test -n "${DB_PASS}" || { echo "::error::Secret DB_PASS ist leer"; exit 1; }
          {
            echo "APP_ENV=prod"
            echo "APP_URL=${APP_URL:-https://rechnung.premium-monteurzimmer.com}"
            echo "DB_HOST=${DB_HOST:-10.35.232.161}"
            echo "DB_PORT=${DB_PORT:-3306}"
            echo "DB_NAME=${DB_NAME:-k312683_wordpress_2}"
            echo "DB_USER=${DB_USER:-k312683_wordpress_f}"
            echo "DB_PASS=${DB_PASS}"
            echo "DB_PREFIX=${DB_PREFIX:-pmz_}"
            echo "STORAGE_PATH=storage"
          } > .env

      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          test -n "${SSH_PRIVATE_KEY}" || { echo "::error::Secret SSH_PRIVATE_KEY fehlt"; exit 1; }
          test -n "${SSH_HOST}"        || { echo "::error::Secret SSH_HOST fehlt"; exit 1; }

          # Beim Einfuegen in die GitHub-Oberflaeche landen leicht Leerzeichen
          # oder ein Zeilenumbruch im Wert. ssh meldet dann nur "hostname
          # contains invalid characters" und nennt den Grund nicht.
          HOST_CLEAN="$(printf '%s' "${SSH_HOST}" | tr -d '[:space:]')"

          case "${HOST_CLEAN}" in
            *://*)  echo "::error::SSH_HOST enthaelt ein Protokoll. Nur den Hostnamen eintragen, ohne https:// oder ssh://"; exit 1 ;;
            *@*)    echo "::error::SSH_HOST enthaelt ein @. Benutzer gehoert in SSH_USER, hier nur der Hostname"; exit 1 ;;
            */*)    echo "::error::SSH_HOST enthaelt einen Pfad. Hier nur der Hostname"; exit 1 ;;
            *:*)    echo "::error::SSH_HOST enthaelt einen Port. Der gehoert in SSH_PORT"; exit 1 ;;
          esac

          if ! printf '%s' "${HOST_CLEAN}" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::SSH_HOST enthaelt unzulaessige Zeichen (Laenge ${#HOST_CLEAN})"
            exit 1
          fi

          if [ "${HOST_CLEAN}" != "${SSH_HOST}" ]; then
            echo "::warning::SSH_HOST enthielt Leerraum, der entfernt wurde - im Secret bitte korrigieren"
          fi

          echo "PMZ_SSH_HOST=${HOST_CLEAN}" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            # Ohne hinterlegten Fingerabdruck bleibt nur Vertrauen beim ersten
            # Kontakt. Das ist angreifbar, deshalb die Warnung - SSH_KNOWN_HOSTS
            # setzen und diesen Zweig loswerden.
            echo "::warning::SSH_KNOWN_HOSTS ist nicht gesetzt, der Hostschlüssel wird ungeprüft übernommen"
            # Schluesseltypen ausdruecklich nennen und Fehler NICHT verschlucken:
            # ein leer gebliebenes known_hosts faellt sonst erst bei rsync auf,
            # und dann mit einer Meldung, die auf etwas anderes zeigt.
            ssh-keyscan -t rsa,ecdsa,ed25519 -p "${SSH_PORT:-22}" "${HOST_CLEAN}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts ist leer - weder SSH_KNOWN_HOSTS gesetzt noch ssh-keyscan erfolgreich"
            exit 1
          fi

          # Der Server bietet ED25519 an. Fehlt der Typ, scheitert rsync mit
          # "No ED25519 host key is known" - das hier sagt vorher warum.
          if ! grep -q 'ssh-ed25519' ~/.ssh/known_hosts; then
            echo "::error::In known_hosts fehlt der ED25519-Schluessel. Secret neu erzeugen mit:"
            echo "::error::  ssh-keyscan -t rsa,ecdsa,ed25519 ${HOST_CLEAN}"
            echo "Vorhandene Eintraege (nur Typen):"
            awk '{print "  " $2}' ~/.ssh/known_hosts | sort -u
            exit 1
          fi

          echo "known_hosts: $(wc -l < ~/.ssh/known_hosts) Eintrag/Eintraege"

      # Der netcup-Server hat kein rsync. tar ueber eine SSH-Pipe braucht auf
      # der Gegenseite nur tar und gzip und uebertraegt alles als einen
      # Datenstrom - genau das, woran der FTP-Sync mit 4.270 Einzeldateien
      # gescheitert ist.
      - name: Übertragen
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eo pipefail

          SSH_USER="$(printf '%s' "${SSH_USER}" | tr -d '[:space:]')"
          DEPLOY_PATH="$(printf '%s' "${DEPLOY_PATH}" | tr -d '[:space:]')"
          DEPLOY_PATH="${DEPLOY_PATH%/}"

          test -n "${SSH_USER}" || { echo "::error::Secret SSH_USER fehlt"; exit 1; }

          # Auf dem Server wird geloescht und entpackt. Ein leerer oder
          # falscher Pfad waere hier verheerend, deshalb vorher pruefen.
          case "${DEPLOY_PATH}" in
            /*/httpdocs) ;;
            *) echo "::error::DEPLOY_PATH sieht falsch aus: '${DEPLOY_PATH}' (erwartet /.../httpdocs)"; exit 1 ;;
          esac

          echo "Ziel: ${SSH_USER}@${PMZ_SSH_HOST}:${DEPLOY_PATH}/"

          # Bewusst ohne Anfuehrungszeichen verwendet: die Werte sind oben von
          # Leerraum befreit und validiert, Wortaufteilung ist hier gewollt.
          SSH_CMD="ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes ${SSH_USER}@${PMZ_SSH_HOST}"

          $SSH_CMD "command -v tar >/dev/null || { echo 'tar fehlt auf dem Server'; exit 1; }"

          # vendor/ wird vollstaendig mitgeliefert. Vorher loeschen, damit
          # Pakete aus einem aelteren Stand nicht liegen bleiben - tar
          # ueberschreibt nur, es raeumt nicht auf.
          $SSH_CMD "mkdir -p '${DEPLOY_PATH}' && rm -rf '${DEPLOY_PATH}/vendor'"

          tar czf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./tests' \
            --exclude='./scripts' \
            --exclude='./storage' \
            --exclude='./phpunit.xml' \
            --exclude='./.phpunit.cache' \
            --exclude='.DS_Store' \
            . | $SSH_CMD "cd '${DEPLOY_PATH}' && tar xzf -"

          echo "vendor-Dateien auf dem Server: $($SSH_CMD "find '${DEPLOY_PATH}/vendor' -type f | wc -l" | tr -d ' ')"

      # Anders als beim FTP-Deploy erreicht der Runner die paketinterne MySQL
      # jetzt indirekt - ueber die SSH-Sitzung auf dem Server selbst.
      # Die Migration ist idempotent: bereits angewandte Dateien stehen in
      # pmz_migrations und werden uebersprungen.
      - name: Datenbank migrieren
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_USER="$(printf '%s' "${SSH_USER}" | tr -d '[:space:]')"
          DEPLOY_PATH="$(printf '%s' "${DEPLOY_PATH}" | tr -d '[:space:]')"

          SSH_CMD="ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes ${SSH_USER}@${PMZ_SSH_HOST}"

          $SSH_CMD "cd '${DEPLOY_PATH%/}' && mkdir -p storage/invoices storage/tmp && php db/migrate.php"

          # Dateien zaehlen beweist nichts - der FTP-Sync galt mit 2.515 von
          # 4.270 Dateien als erfolgreich. Deshalb auf dem Server ausprobieren,
          # ob Autoloader, Bibliotheken und Datenbank wirklich tragen.
          $SSH_CMD "cd '${DEPLOY_PATH%/}' && php bin/healthcheck.php"

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/deploy_key
